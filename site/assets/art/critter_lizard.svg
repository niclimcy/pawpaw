<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Top-down blue-tailed skink with natural proportions in a soft hand-painted style, head facing up. Original artwork for Paw Paw. -->
  <!-- Cream stripes and a blue tail suit cat vision. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Short toes -->
    <g stroke="#3d301c" stroke-width="5">
      <path d="M62 42 L55 37 M62 42 L59 33 M62 42 L66 33 M138 42 L145 37 M138 42 L141 33 M138 42 L134 33"/>
      <path d="M58 138 L50 140 M58 138 L53 146 M58 138 L60 147 M142 138 L150 140 M142 138 L147 146 M142 138 L140 147"/>
    </g>
    <g stroke="#d9c078" stroke-width="2.4">
      <path d="M62 42 L55 37 M62 42 L59 33 M62 42 L66 33 M138 42 L145 37 M138 42 L141 33 M138 42 L134 33"/>
      <path d="M58 138 L50 140 M58 138 L53 146 M58 138 L60 147 M142 138 L150 140 M142 138 L147 146 M142 138 L140 147"/>
    </g>
    <!-- Small bent legs -->
    <path d="M88 62 L68 57 L62 42 M112 62 L132 57 L138 42 M88 124 L64 118 L58 138 M112 124 L136 118 L142 138" stroke="#3d301c" stroke-width="10"/>
    <path d="M88 62 L68 57 L62 42 M112 62 L132 57 L138 42 M88 124 L64 118 L58 138 M112 124 L136 118 L142 138" stroke="#a88a48" stroke-width="5.5"/>
  </g>
  <!-- Long tapering blue tail -->
  <path d="M88 130 C 90 160, 112 182, 135 196 C 139 199, 143 196, 140 192 C 122 176, 112 156, 112 130 Z" fill="#4f8fe0" stroke="#3d301c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M97 146 C 102 164, 116 180, 134 192 C 120 178, 110 164, 106 146 Z" fill="#a5cbf5" opacity="0.8"/>
  <!-- Slim head, neck and body -->
  <path d="M100 10 C 108 10, 114 20, 114 31 C 114 40, 111 46, 111 52 C 116 64, 119 80, 118 96 C 117 112, 114 126, 110 138 C 106 142, 94 142, 90 138 C 86 126, 83 112, 82 96 C 81 80, 84 64, 89 52 C 89 46, 86 40, 86 31 C 86 20, 92 10, 100 10 Z" fill="#9c7f42" stroke="#3d301c" stroke-width="3" stroke-linejoin="round"/>
  <!-- Dark back between two cream stripes -->
  <path d="M100 20 C 105 40, 108 70, 108 96 C 108 114, 105 128, 102 137 L 98 137 C 95 128, 92 114, 92 96 C 92 70, 95 40, 100 20 Z" fill="#5c4a24" opacity="0.6"/>
  <g stroke="#f3e6a4" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M92 30 C 91 46, 86 70, 87 96 C 88 114, 91 126, 93 135"/>
    <path d="M108 30 C 109 46, 114 70, 113 96 C 112 114, 109 126, 107 135"/>
  </g>
  <path d="M100 16 C 100 50, 100 100, 100 134" stroke="#d9c078" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- Small eyes at the sides of the head -->
  <ellipse cx="89" cy="26" rx="3" ry="3.6" fill="#1f1a16"/>
  <ellipse cx="111" cy="26" rx="3" ry="3.6" fill="#1f1a16"/>
  <circle cx="88.2" cy="24.8" r="1" fill="#fff"/>
  <circle cx="110.2" cy="24.8" r="1" fill="#fff"/>
</svg>
