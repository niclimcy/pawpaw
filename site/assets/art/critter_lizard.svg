<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Top-down gecko, head facing up. Original artwork for Paw Paw. -->
  <!-- Splayed legs -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86 74 L58 60 L50 40 M114 74 L142 60 L150 40 M86 126 L58 140 L52 162 M114 126 L142 140 L148 162" stroke="#1d1d24" stroke-width="13"/>
    <path d="M86 74 L58 60 L50 40 M114 74 L142 60 L150 40 M86 126 L58 140 L52 162 M114 126 L142 140 L148 162" stroke="#f4d34a" stroke-width="7"/>
  </g>
  <g fill="#f4d34a" stroke="#1d1d24" stroke-width="3">
    <circle cx="50" cy="38" r="7"/>
    <circle cx="150" cy="38" r="7"/>
    <circle cx="52" cy="164" r="7"/>
    <circle cx="148" cy="164" r="7"/>
  </g>
  <!-- Curling blue tail -->
  <path d="M90 136 C 88 160, 104 180, 132 196 C 114 174, 108 156, 110 136 Z" fill="#3f7fe8" stroke="#1d1d24" stroke-width="5" stroke-linejoin="round"/>
  <!-- Long body with dark spots -->
  <ellipse cx="100" cy="102" rx="23" ry="44" fill="#f4d34a" stroke="#1d1d24" stroke-width="5"/>
  <g fill="#24366b">
    <circle cx="92" cy="84" r="5"/>
    <circle cx="108" cy="94" r="5"/>
    <circle cx="94" cy="110" r="5"/>
    <circle cx="108" cy="124" r="4.5"/>
    <circle cx="96" cy="134" r="4"/>
  </g>
  <!-- Wedge-shaped head -->
  <path d="M100 18 C 118 20, 124 40, 120 56 C 116 68, 108 72, 100 72 C 92 72, 84 68, 80 56 C 76 40, 82 20, 100 18 Z" fill="#f4d34a" stroke="#1d1d24" stroke-width="5"/>
  <circle cx="85" cy="42" r="6.5" fill="#1d1d24"/>
  <circle cx="115" cy="42" r="6.5" fill="#1d1d24"/>
  <circle cx="83.4" cy="40" r="2" fill="#fff"/>
  <circle cx="113.4" cy="40" r="2" fill="#fff"/>
</svg>
