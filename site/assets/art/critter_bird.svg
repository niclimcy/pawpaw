<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Top-down small ground bird in a soft hand-painted style, beak facing up. Original artwork for Paw Paw. -->
  <g stroke="#3d3340" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Fanned tail -->
    <path d="M88 140 C 82 160, 76 178, 72 191 Q 100 200, 128 191 C 124 178, 118 160, 112 140 Z" fill="#4f82cf"/>
    <path d="M100 152 L100 193 M93 154 L84 190 M107 154 L116 190" fill="none" stroke-width="2" opacity="0.45"/>
    <!-- Plump body, yellow on the back -->
    <ellipse cx="100" cy="112" rx="37" ry="47" fill="#f0d065"/>
  </g>
  <path d="M100 74 C 110 96, 110 130, 100 154 C 90 130, 90 96, 100 74 Z" fill="#cfa93f" opacity="0.55"/>
  <path d="M92 80 C 88 100, 88 126, 94 146 C 90 126, 90 100, 96 80 Z" fill="#fbeeb0" opacity="0.8"/>
  <!-- Folded wings -->
  <g stroke="#3d3340" stroke-width="3.5" stroke-linejoin="round">
    <path d="M68 84 C 52 104, 56 146, 92 178 C 93 146, 91 112, 85 86 C 81 79, 72 79, 68 84 Z" fill="#5a8fdb"/>
    <path d="M132 84 C 148 104, 144 146, 108 178 C 107 146, 109 112, 115 86 C 119 79, 128 79, 132 84 Z" fill="#5a8fdb"/>
  </g>
  <!-- Painted feathers: light shoulders, dark flight feathers, a cream wing bar -->
  <path d="M70 88 C 62 98, 60 110, 62 120 C 70 112, 78 108, 86 106 C 86 98, 84 92, 82 88 C 78 84, 73 85, 70 88 Z" fill="#8fb6ee" opacity="0.85"/>
  <path d="M130 88 C 138 98, 140 110, 138 120 C 130 112, 122 108, 114 106 C 114 98, 116 92, 118 88 C 122 84, 127 85, 130 88 Z" fill="#8fb6ee" opacity="0.55"/>
  <g stroke="#34599e" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M66 132 C 72 148, 80 160, 90 170 M76 128 C 80 144, 84 156, 90 166 M134 132 C 128 148, 120 160, 110 170 M124 128 C 120 144, 116 156, 110 166"/>
  </g>
  <path d="M61 118 C 70 114, 80 114, 88 118 M139 118 C 130 114, 120 114, 112 118" stroke="#faf3e0" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Head: cream cheeks, blue cap, dark eye stripe -->
  <circle cx="100" cy="58" r="28" fill="#fbf4e2" stroke="#3d3340" stroke-width="3.5"/>
  <path d="M100 36 C 114 36, 121 48, 118 62 C 110 72, 90 72, 82 62 C 79 48, 86 36, 100 36 Z" fill="#5a8fdb"/>
  <path d="M90 42 C 95 38, 104 38, 110 41 C 102 42, 95 46, 91 54 C 88 50, 88 45, 90 42 Z" fill="#8fb6ee" opacity="0.85"/>
  <path d="M92 34 C 82 38, 75 46, 73 56 M108 34 C 118 38, 125 46, 127 56" stroke="#2f3e63" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="76" cy="56" r="5" fill="#27222a"/>
  <circle cx="124" cy="56" r="5" fill="#27222a"/>
  <circle cx="74.6" cy="54.2" r="1.7" fill="#fff"/>
  <circle cx="122.6" cy="54.2" r="1.7" fill="#fff"/>
  <!-- Short beak -->
  <path d="M93 35 C 95 26, 98 20, 100 16 C 102 20, 105 26, 107 35 Z" fill="#f0a53c" stroke="#3d3340" stroke-width="3" stroke-linejoin="round"/>
</svg>
