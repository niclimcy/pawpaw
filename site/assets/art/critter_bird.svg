<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Top-down small ground bird, beak facing up. Original artwork for Paw Paw. -->
  <!-- Fanned tail -->
  <path d="M88 140 L76 190 Q 100 198, 124 190 L112 140 Z" fill="#3f7fe8" stroke="#1d1d24" stroke-width="5" stroke-linejoin="round"/>
  <path d="M100 150 L100 190 M92 152 L86 188 M108 152 L114 188" stroke="#1d1d24" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- Round body, yellow on the back -->
  <ellipse cx="100" cy="112" rx="34" ry="46" fill="#f4d34a" stroke="#1d1d24" stroke-width="5"/>
  <!-- Folded wings with a pale bar -->
  <path d="M70 86 C 58 108, 62 146, 92 172 C 90 140, 88 110, 84 88 Z" fill="#3f7fe8" stroke="#1d1d24" stroke-width="4" stroke-linejoin="round"/>
  <path d="M130 86 C 142 108, 138 146, 108 172 C 110 140, 112 110, 116 88 Z" fill="#3f7fe8" stroke="#1d1d24" stroke-width="4" stroke-linejoin="round"/>
  <path d="M66 114 L86 118 M134 114 L114 118" stroke="#f6f2e4" stroke-width="5" stroke-linecap="round"/>
  <!-- Head: white cheeks, blue cap -->
  <circle cx="100" cy="58" r="27" fill="#f6f2e4" stroke="#1d1d24" stroke-width="5"/>
  <ellipse cx="100" cy="54" rx="18" ry="15" fill="#3f7fe8"/>
  <circle cx="78" cy="56" r="5" fill="#1d1d24"/>
  <circle cx="122" cy="56" r="5" fill="#1d1d24"/>
  <circle cx="76.6" cy="54.4" r="1.6" fill="#fff"/>
  <circle cx="120.6" cy="54.4" r="1.6" fill="#fff"/>
  <!-- Short beak -->
  <path d="M93 34 L100 18 L107 34 Z" fill="#f2a93b" stroke="#1d1d24" stroke-width="3.5" stroke-linejoin="round"/>
</svg>
