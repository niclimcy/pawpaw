<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Mid-hop pose of critter_cricket: hind legs kicked straight back, the rest tucked in. Original artwork for Paw Paw. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Antennae swept back, front and middle legs tucked -->
    <g stroke="#2e4419" stroke-width="7">
      <path d="M93 22 C 88 14, 82 10, 74 10"/>
      <path d="M107 22 C 112 14, 118 10, 126 10"/>
      <path d="M84 64 L68 66 L62 78"/>
      <path d="M116 64 L132 66 L138 78"/>
      <path d="M84 82 L66 96 L62 112"/>
      <path d="M116 82 L134 96 L138 112"/>
    </g>
    <g stroke="#b7d968" stroke-width="3.5">
      <path d="M93 22 C 88 14, 82 10, 74 10"/>
      <path d="M107 22 C 112 14, 118 10, 126 10"/>
      <path d="M84 64 L68 66 L62 78"/>
      <path d="M116 64 L132 66 L138 78"/>
      <path d="M84 82 L66 96 L62 112"/>
      <path d="M116 82 L134 96 L138 112"/>
    </g>
    <!-- Hind shins straightened behind the knees -->
    <path d="M71 146 L60 194 M129 146 L140 194" stroke="#2e4419" stroke-width="7"/>
    <path d="M71 146 L60 194 M129 146 L140 194" stroke="#b7d968" stroke-width="3.5"/>
  </g>
  <!-- Wings lifting slightly apart -->
  <g stroke="#2e4419" stroke-width="3" stroke-linejoin="round">
    <path transform="rotate(-6 100 86)" d="M100 84 C 112 86, 116 112, 114 150 C 112 170, 106 182, 100 190 Z" fill="#7d9a3a"/>
    <path transform="rotate(6 100 86)" d="M100 84 C 88 86, 84 112, 86 150 C 88 170, 94 182, 100 190 Z" fill="#a3c050"/>
  </g>
  <g transform="rotate(6 100 86)">
    <path d="M92 92 C 88 112, 88 140, 92 166 C 92 140, 93 114, 96 94 C 95 90, 93 90, 92 92 Z" fill="#d7eb98" opacity="0.6"/>
    <path d="M95 96 C 91 124, 91 154, 96 182" stroke="#5d7a2a" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
  <path transform="rotate(-6 100 86)" d="M106 96 C 110 124, 110 154, 104 182" stroke="#5d7a2a" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Thighs swung back for the kick -->
  <g stroke="#2e4419" stroke-width="3" stroke-linejoin="round">
    <path d="M90 92 C 80 104, 72 120, 68 140 C 66 148, 74 150, 77 143 C 82 126, 88 112, 96 102 Z" fill="#8cc63f"/>
    <path d="M110 92 C 120 104, 128 120, 132 140 C 134 148, 126 150, 123 143 C 118 126, 112 112, 104 102 Z" fill="#8cc63f"/>
  </g>
  <path d="M87 98 C 80 110, 74 124, 71 138" stroke="#d2ea8c" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M113 98 C 120 110, 126 124, 129 138" stroke="#5d8f2b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  <g stroke="#5d8f2b" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M84 108 L79 113 M81 118 L75 123 M78 128 L72 133"/>
    <path d="M116 108 L121 113 M119 118 L125 123 M122 128 L128 133"/>
  </g>
  <!-- Head and saddle, as at rest -->
  <path d="M100 14 C 112 14, 119 26, 119 40 C 119 50, 113 56, 100 56 C 87 56, 81 50, 81 40 C 81 26, 88 14, 100 14 Z" fill="#9ccf4a" stroke="#2e4419" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="95" cy="26" rx="7" ry="9" fill="#d2ea8c" opacity="0.7"/>
  <ellipse cx="84.5" cy="34" rx="5" ry="7.5" fill="#7a5530" stroke="#2e4419" stroke-width="1.5"/>
  <ellipse cx="115.5" cy="34" rx="5" ry="7.5" fill="#7a5530" stroke="#2e4419" stroke-width="1.5"/>
  <circle cx="83.5" cy="31" r="1.4" fill="#fff"/>
  <circle cx="114.5" cy="31" r="1.4" fill="#fff"/>
  <path d="M80 54 C 84 48, 116 48, 120 54 C 124 68, 123 82, 117 90 C 108 94, 92 94, 83 90 C 77 82, 76 68, 80 54 Z" fill="#8cc63f" stroke="#2e4419" stroke-width="3" stroke-linejoin="round"/>
  <path d="M88 58 C 92 54, 100 53, 106 54 C 98 60, 93 70, 91 82 C 87 76, 86 66, 88 58 Z" fill="#c5e37a" opacity="0.6"/>
  <path d="M84 56 C 82 68, 83 80, 87 88 M116 56 C 118 68, 117 80, 113 88" stroke="#eef0c0" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M100 52 L100 92" stroke="#5d8f2b" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
