<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Flying pose of critter_bug: wing cases swung open, clear hind wings spread, legs tucked. Original artwork for Paw Paw. -->
  <!-- Antennae and tucked legs -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#f3e2b4" stroke-width="9">
      <path d="M92 30 C 88 20, 80 14, 70 14"/>
      <path d="M108 30 C 112 20, 120 14, 130 14"/>
      <path d="M82 150 L74 164 M118 150 L126 164"/>
    </g>
    <g stroke="#4a2f28" stroke-width="4.5">
      <path d="M92 30 C 88 20, 80 14, 70 14"/>
      <path d="M108 30 C 112 20, 120 14, 130 14"/>
      <path d="M82 150 L74 164 M118 150 L126 164"/>
    </g>
  </g>
  <!-- Clear hind wings, longer than the wing cases -->
  <g fill="#eef4f8" stroke="#f6e4b4" stroke-width="2.5" stroke-linejoin="round" opacity="0.72">
    <path d="M94 68 C 60 78, 24 128, 24 172 C 26 192, 46 194, 62 178 C 82 154, 94 118, 98 84 Z"/>
    <path d="M106 68 C 140 78, 176 128, 176 172 C 174 192, 154 194, 138 178 C 118 154, 106 118, 102 84 Z"/>
  </g>
  <g stroke="#8f9aa6" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M92 78 C 68 104, 44 140, 34 178 M92 86 C 78 116, 64 148, 54 180 M70 110 C 62 122, 52 130, 40 136"/>
    <path d="M108 78 C 132 104, 156 140, 166 178 M108 86 C 122 116, 136 148, 146 180 M130 110 C 138 122, 148 130, 160 136"/>
  </g>
  <!-- Abdomen, normally hidden under the shell -->
  <ellipse cx="100" cy="112" rx="24" ry="46" fill="#33222a" stroke="#f6e4b4" stroke-width="3"/>
  <path d="M80 96 Q 100 102, 120 96 M78 114 Q 100 120, 122 114 M80 132 Q 100 138, 120 132 M86 148 Q 100 153, 114 148" stroke="#6b4a44" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Wing cases: each half of the shell swung out from its hinge -->
  <g transform="translate(100 56) rotate(40) scale(0.92) translate(-100 -56)">
    <path d="M100 50 C 68 50, 44 84, 42 118 C 44 152, 68 178, 100 178 Z" fill="#de4f38" stroke="#f6e4b4" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M62 72 C 72 60, 86 56, 98 56 C 82 78, 76 126, 82 168 C 64 156, 48 132, 47 108 C 46 94, 52 82, 62 72 Z" fill="#f58f6c" opacity="0.6"/>
    <g fill="#3a2422">
      <path d="M100 62 C 94 62, 91 67, 91 72 C 91 78, 95 82, 100 82 Z"/>
      <ellipse cx="70" cy="96" rx="11" ry="12" transform="rotate(-12 70 96)"/>
      <ellipse cx="68" cy="136" rx="9" ry="10" transform="rotate(14 68 136)"/>
      <ellipse cx="87" cy="158" rx="6" ry="6.5"/>
    </g>
    <ellipse cx="78" cy="74" rx="10" ry="4.5" fill="#fff6e6" opacity="0.75" transform="rotate(-32 78 74)"/>
  </g>
  <g transform="translate(100 56) rotate(-40) scale(0.92) translate(-100 -56)">
    <path d="M100 50 C 132 50, 156 84, 158 118 C 156 152, 132 178, 100 178 Z" fill="#de4f38" stroke="#f6e4b4" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M152 100 C 156 134, 136 166, 104 175 C 124 160, 140 136, 144 106 C 146 100, 150 96, 152 100 Z" fill="#a8302a" opacity="0.6"/>
    <g fill="#3a2422">
      <path d="M100 62 C 106 62, 109 67, 109 72 C 109 78, 105 82, 100 82 Z"/>
      <ellipse cx="130" cy="96" rx="11" ry="12" transform="rotate(12 130 96)"/>
      <ellipse cx="132" cy="136" rx="9" ry="10" transform="rotate(-14 132 136)"/>
      <ellipse cx="113" cy="158" rx="6" ry="6.5"/>
    </g>
  </g>
  <!-- Head and collar, as at rest -->
  <ellipse cx="100" cy="36" rx="17" ry="11" fill="#33222a" stroke="#f3e2b4" stroke-width="3.5"/>
  <circle cx="90" cy="31" r="2.6" fill="#f8efd6"/>
  <circle cx="110" cy="31" r="2.6" fill="#f8efd6"/>
  <path d="M68 54 C 68 34, 132 34, 132 54 C 120 62, 80 62, 68 54 Z" fill="#33222a" stroke="#f6e4b4" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="80" cy="48" rx="7" ry="5.5" fill="#f8efd6" transform="rotate(-20 80 48)"/>
  <ellipse cx="120" cy="48" rx="7" ry="5.5" fill="#f8efd6" transform="rotate(20 120 48)"/>
</svg>
